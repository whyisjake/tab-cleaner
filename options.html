<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tab Cleaner Options</title>
    <link rel="stylesheet" href="ui.css">
    <link rel="stylesheet" href="options.css">
</head>

<body>
    <main class="page">
        <header class="page-header brand">
            <span class="brand-mark"><img src="icons/icon48.png" alt=""></span>
            <div>
                <h1 class="brand-name">Tab Cleaner</h1>
                <p class="brand-meta">Settings</p>
            </div>
        </header>

        <section class="card" aria-labelledby="settingsHeading">
            <div class="card-header">
                <h2 class="card-title" id="settingsHeading">Settings</h2>
            </div>

            <div class="settings-list">
                <div class="setting-row">
                    <div class="setting-label">
                        <label for="inactiveTime">Close tabs after</label>
                        <span class="setting-help" id="inactiveTimeHelp">Default: 1 hour</span>
                    </div>
                    <div class="setting-control">
                        <input type="number" id="inactiveTime" min="0.5" step="0.5" value="1" aria-describedby="inactiveTimeHelp">
                        <span class="setting-unit">hours</span>
                    </div>
                </div>

                <div class="setting-row">
                    <div class="setting-label">
                        <label for="checkInterval">Check every</label>
                        <span class="setting-help" id="checkIntervalHelp">Default: 5 minutes</span>
                    </div>
                    <div class="setting-control">
                        <input type="number" id="checkInterval" min="1" max="60" value="5" aria-describedby="checkIntervalHelp">
                        <span class="setting-unit">minutes</span>
                    </div>
                </div>

                <label class="setting-row setting-check" for="ignorePinned">
                    <input type="checkbox" id="ignorePinned" checked>
                    <span>Never close pinned tabs</span>
                </label>

                <label class="setting-row setting-check" for="ignoreAudible">
                    <input type="checkbox" id="ignoreAudible" checked>
                    <span>Never close tabs playing audio</span>
                </label>
            </div>

            <div class="settings-actions">
                <button class="btn btn-primary" id="saveBtn">Save Settings</button>
                <span class="status badge safe" id="status" role="status" aria-live="polite">Settings saved successfully!</span>
            </div>
        </section>

        <section class="card" aria-labelledby="activityHeading">
            <div class="card-header">
                <h2 class="card-title" id="activityHeading">Tab activity</h2>
                <button class="btn btn-secondary" id="refreshBtn">Refresh Tab List</button>
            </div>
            <div class="tab-stats" id="tabStats">
                Click refresh to view stats
            </div>
            <div class="tabs-container" id="tabsContainer">
                <div class="empty-state">
                    Click "Refresh Tab List" to view current tabs
                </div>
            </div>
        </section>

        <footer class="site-footer">
          <ul class="social-links">
            <li><a class="social-link" href="https://github.com/whyisjake" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub"><svg aria-hidden="true"><use href="icons/social.svg#github"></use></svg></a></li>
            <li><a class="social-link" href="https://x.com/whyisjake" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter)" title="X (Twitter)"><svg aria-hidden="true"><use href="icons/social.svg#x"></use></svg></a></li>
            <li><a class="social-link" href="https://instagram.com/whyisjake" target="_blank" rel="noopener noreferrer" aria-label="Instagram" title="Instagram"><svg aria-hidden="true"><use href="icons/social.svg#instagram"></use></svg></a></li>
            <li><a class="social-link" href="https://facebook.com/whyisjake" target="_blank" rel="noopener noreferrer" aria-label="Facebook" title="Facebook"><svg aria-hidden="true"><use href="icons/social.svg#facebook"></use></svg></a></li>
            <li><a class="social-link" href="https://jakespurlock.com" target="_blank" rel="noopener noreferrer" aria-label="jakespurlock.com" title="jakespurlock.com"><svg aria-hidden="true"><use href="icons/social.svg#website"></use></svg></a></li>
          </ul>
          <a class="credit" href="https://jakespurlock.com" target="_blank" rel="noopener noreferrer">Made by Jake Spurlock</a>
        </footer>
    </main>

    <script src="options.js"></script>
</body>

</html>
