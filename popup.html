<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Tab Cleaner</title>
    <link rel="stylesheet" href="ui.css">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header class="brand popup-header">
        <span class="brand-mark"><img src="icons/icon48.png" alt=""></span>
        <div class="popup-header-text">
            <h1 class="brand-name">Tab Cleaner</h1>
            <p class="brand-meta" id="chromeInfo">Loading...</p>
        </div>
    </header>

    <main>
        <div aria-live="polite">
            <div id="loadingMessage" class="empty-state">
                Loading statistics...
            </div>

            <div id="errorMessage" class="empty-state error">
                Error loading statistics
            </div>
        </div>

        <section id="statsContainer" aria-label="Statistics">
            <dl class="stats-grid">
                <div class="card stat-tile">
                    <dt class="stat-label">Open windows</dt>
                    <dd class="stat-value" id="openWindows">-</dd>
                </div>
                <div class="card stat-tile">
                    <dt class="stat-label">Open tabs</dt>
                    <dd class="stat-value" id="openTabs">-</dd>
                </div>
                <div class="card stat-tile">
                    <dt class="stat-label">Tabs in window</dt>
                    <dd class="stat-value" id="currentWindowTabs">-</dd>
                </div>
                <div class="card stat-tile">
                    <dt class="stat-label">Pinned in window</dt>
                    <dd class="stat-value" id="currentWindowPinned">-</dd>
                </div>
                <div class="card stat-tile">
                    <dt class="stat-label">Removed, all time</dt>
                    <dd class="stat-value" id="tabsRemoved">-</dd>
                </div>
                <div class="card stat-tile">
                    <dt class="stat-label">Max concurrent</dt>
                    <dd class="stat-value" id="maxConcurrentTabs">-</dd>
                </div>
            </dl>

            <div class="popup-actions">
                <button type="button" class="btn btn-secondary" id="refreshBtn">Refresh</button>
                <button type="button" class="btn btn-secondary" id="openOptionsBtn">Options</button>
                <button type="button" class="btn btn-ghost btn-sm reset-btn" id="resetBtn">Reset stats</button>
            </div>
        </section>

        <section id="recentlyClosedContainer" aria-labelledby="recentlyClosedTitle">
            <div class="card recently-closed">
                <h2 class="card-title" id="recentlyClosedTitle">Recently Closed Tabs</h2>
                <div id="recentlyClosedList" class="closed-list">
                    <div class="empty-state">No recently closed tabs</div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
      <ul class="social-links">
        <li><a class="social-link" href="https://github.com/whyisjake" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub"><svg aria-hidden="true"><use href="icons/social.svg#github"></use></svg></a></li>
        <li><a class="social-link" href="https://x.com/whyisjake" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter)" title="X (Twitter)"><svg aria-hidden="true"><use href="icons/social.svg#x"></use></svg></a></li>
        <li><a class="social-link" href="https://instagram.com/whyisjake" target="_blank" rel="noopener noreferrer" aria-label="Instagram" title="Instagram"><svg aria-hidden="true"><use href="icons/social.svg#instagram"></use></svg></a></li>
        <li><a class="social-link" href="https://facebook.com/whyisjake" target="_blank" rel="noopener noreferrer" aria-label="Facebook" title="Facebook"><svg aria-hidden="true"><use href="icons/social.svg#facebook"></use></svg></a></li>
        <li><a class="social-link" href="https://jakespurlock.com" target="_blank" rel="noopener noreferrer" aria-label="jakespurlock.com" title="jakespurlock.com"><svg aria-hidden="true"><use href="icons/social.svg#website"></use></svg></a></li>
      </ul>
      <a class="credit" href="https://jakespurlock.com" target="_blank" rel="noopener noreferrer">Made by Jake Spurlock</a>
    </footer>

    <script src="popup.js"></script>
</body>
</html>
