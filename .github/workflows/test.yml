name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    # Fails the build below 100% line/branch/function coverage of background.js
    - name: Run tests with coverage
      run: npm run test:ci

    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@v5
      with:
        files: ./lcov.info
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
